name: Build All OS Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-ru"

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc

      - name: Build Windows binary & portable zip
        shell: bash
        run: |
          cargo build --release --locked --bin degenview
          mkdir -p dist
          7z a "dist/DegenView-v0.6.0-rc.34-windows-x64.zip" ./target/release/degenview.exe \
            ./assets/fonts/OFL-JetBrainsMono.txt ./assets/fonts/OFL-NotoSansSymbols2.txt ./assets/fonts/OFL-Inter.txt ./assets/fonts/README.md

      - name: Build Windows Installer (Setup Exe)
        shell: bash
        run: |
          choco install innosetup --version "6.7.1" -y --no-progress
          ./tools/windows-installer.sh v0.6.0-rc.34 target/release/degenview.exe x64

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-assets
          path: dist/*

  linux:
    name: Build Linux (x64)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-gnu

      - name: Build Linux binary & tar.gz package
        run: |
          cargo build --release --locked --bin degenview
          mkdir -p dist pkg pkg/licenses
          cp target/release/degenview pkg/
          cp assets/brand/DegenView-512-rounded.png pkg/degenview.png
          cp packaging/degenview.desktop pkg/
          cp assets/fonts/OFL-JetBrainsMono.txt assets/fonts/OFL-NotoSansSymbols2.txt assets/fonts/OFL-Inter.txt pkg/licenses/
          cp assets/fonts/README.md pkg/licenses/FONTS.md
          tar -czf "dist/DegenView-v0.6.0-rc.34-linux-x64.tar.gz" -C pkg .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-assets
          path: dist/*

  macos:
    name: Build macOS (arm64)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install dmgbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgvenv"
          "$RUNNER_TEMP/dmgvenv/bin/pip" install --quiet --require-hashes -r tools/requirements/dmgbuild.txt
          echo "$RUNNER_TEMP/dmgvenv/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Build macOS binaries
        run: |
          cargo build --release --locked --bin degenview --bin degenview-alert-agent

      - name: Package macOS App Bundle
        env:
          DEGENVIEW_SKIP_BUILD: "1"
        run: |
          ./tools/bundle.sh
          codesign --force --deep --sign - target/DegenView.app

      - name: Build macOS DMG and ZIP
        run: |
          mkdir -p dist
          ./tools/make-dmg.sh target/DegenView.app "dist/DegenView-v0.6.0-rc.34-macos-arm64.dmg"
          ditto -c -k --sequesterRsrc --keepParent target/DegenView.app "dist/DegenView-v0.6.0-rc.34-macos-arm64.zip"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-assets
          path: dist/*

  macos-x64:
    name: Build macOS (Intel x64)
    runs-on: macos-15-intel
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install dmgbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgvenv"
          "$RUNNER_TEMP/dmgvenv/bin/pip" install --quiet --require-hashes -r tools/requirements/dmgbuild.txt
          echo "$RUNNER_TEMP/dmgvenv/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Build macOS binaries
        run: |
          cargo build --release --locked --bin degenview --bin degenview-alert-agent

      - name: Package macOS App Bundle
        env:
          DEGENVIEW_SKIP_BUILD: "1"
        run: |
          ./tools/bundle.sh
          codesign --force --deep --sign - target/DegenView.app

      - name: Build macOS DMG and ZIP
        run: |
          mkdir -p dist
          ./tools/make-dmg.sh target/DegenView.app "dist/DegenView-v0.6.0-rc.34-macos-x64.dmg"
          ditto -c -k --sequesterRsrc --keepParent target/DegenView.app "dist/DegenView-v0.6.0-rc.34-macos-x64.zip"

      - name: Upload macOS Intel Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-x64-assets
          path: dist/*

  flatpak:
    name: Build Flatpak
    permissions:
      contents: read
    uses: ./.github/workflows/flatpak.yml
    with:
      bundle-prefix: DegenView-v0.6.0-rc.34-linux
      branch: beta
      arm64: true

  publish:
    name: Publish GitHub Release
    needs: [windows, linux, macos, macos-x64, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download all assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify build artifacts
        run: ls -la dist/

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.6.0-rc.34-ru dist/* \
            --title "DegenView v0.6.0-rc.34 (Russian Localization & Surfer PRO)" \
            --notes "Релиз DegenView v0.6.0-rc.34 с полной локализацией на русский язык, мультичарт-сеткой и встроенным индикатором [Surfer] RSI v1." || \
          gh release upload v0.6.0-rc.34-ru dist/* --clobber
